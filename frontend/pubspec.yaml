name: appp
description: R_Mind App — contrôle d'un rover détecteur de mines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_joystick: ^0.2.2
  flutter_mjpeg: ^2.0.4
  http: ^1.2.1
  intl: ^0.20.2
  provider: ^6.1.5
  google_fonts: 8.0.0
  shared_preferences: ^2.5.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  audioplayers: ^6.1.0

dependency_overrides:
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/Rover.jpg
    - assets/r_mind_logo.png
    - assets/sounds/mine_alert.wav
